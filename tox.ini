[tox]
env_list = cov, py311, py312, py313, py314
isolated_build = true
skip_missing_interpreters = true

[testenv]
deps =
    pico-ioc>=2.2.0
    pico-fastapi>=0.1.0
    pytest>=8
    pytest-asyncio
    httpx
    python-jose[cryptography]>=3.3
    cryptography

commands = pytest -s {posargs:tests}

[testenv:cov]
deps =
    pico-ioc>=2.2.0
    pico-fastapi>=0.1.0
    pytest>=8
    pytest-asyncio
    httpx
    python-jose[cryptography]>=3.3
    cryptography
    pytest-cov>=5

setenv =
    COVERAGE_FILE = {tox_root}/.coverage
commands =
    pytest --cov=pico_client_auth --cov-report=term-missing tests
package = editable

[testenv:pqc-py{311,312,313,314}]
deps =
    {[testenv]deps}
    liboqs-python>=0.11.0

commands = pytest -s {posargs:tests}
